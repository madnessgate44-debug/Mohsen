name: Forge Company Delivery

# The software company audits a target repository, then *implements* the fix:
# it clones the target at the audited commit, runs its own checks, pushes an
# isolated `forge/` branch, and opens a pull request. It never merges and never
# writes to the base branch.
#
# No extra secret is required for repositories this workflow's token can already
# reach: the built-in GITHUB_TOKEN (contents + pull-requests: write) clones,
# pushes, and opens the PR. Only a *different* owner's repository needs a PAT,
# supplied as FORGE_DELIVER_TOKEN, which takes precedence when set.
on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repository in owner/repo format'
        required: true
        default: 'madnessgate44-debug/Amina'
      goal:
        description: 'Optional: a manual goal. Leave empty to let --audit pick the top finding.'
        required: false
        default: ''
      attempts:
        description: 'Independent attempts per work item'
        required: true
        default: '1'
      audit:
        description: 'Run the real audit first and deliver its findings (true/false)'
        required: true
        default: 'true'

permissions:
  contents: write
  pull-requests: write
  # Approving a bot-authored PR's held verification run requires actions:write.
  actions: write

jobs:
  company-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the company
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the company delivery
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Prefer a PAT when one is configured (needed only for another owner's
          # repo); otherwise fall back to the built-in token, which reaches this
          # account's repositories and needs no setup.
          GITHUB_TOKEN: ${{ secrets.FORGE_DELIVER_TOKEN || secrets.GITHUB_TOKEN }}
          FORGE_DELIVER_ATTEMPTS: ${{ inputs.attempts }}
          # Passed through env, never interpolated into the command line, so a
          # goal containing shell metacharacters cannot inject a command.
          TARGET_REPO: ${{ inputs.target_repo }}
          GOAL: ${{ inputs.goal }}
          # 'true' (default) audits first, so the report's "audited <target>"
          # claim is true. 'false' delivers the typed goal, reported as not audited.
          AUDIT_FLAG: ${{ inputs.audit == 'true' && '--audit' || '' }}
        run: npx tsx scripts/deliver.ts $AUDIT_FLAG "$TARGET_REPO" "$GOAL"

      - name: Upload the delivery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-delivery
          path: |
            .firstborn/evidence/company-delivery.md
            .firstborn/evidence/company-delivery.json
            .firstborn/evidence/company-audit.md
            .firstborn/evidence/company-audit.json
          if-no-files-found: warn

      - name: Approve the delivered PR's held verification runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The company delivery opens a PR whose verification runs are held at
          # action_required (GitHub change 2026-06-11) until approved. Without
          # this step the delivered PR is stuck forever and no human is present
          # to click approve. The delivered branch is recorded in the report.
          REPORT=".firstborn/evidence/company-delivery.json"
          if [ ! -f "$REPORT" ]; then
            echo "No delivery report; nothing to approve."
            exit 0
          fi
          # The PR lives in the delivery target (which may be another owner's
          # repo), so read both the target and the branch from the report.
          TARGET=$(node -e "try{const r=require('./'+process.argv[1]);process.stdout.write(r.target||'')}catch(e){}" "$REPORT" 2>/dev/null || echo "")
          BRANCH=$(node -e "try{const r=require('./'+process.argv[1]);process.stdout.write(r.branch||'')}catch(e){}" "$REPORT" 2>/dev/null || echo "")
          if [ -z "$BRANCH" ]; then
            echo "No branch in the delivery report; nothing to approve."
            exit 0
          fi
          # Fall back to this repository when the report has no explicit target.
          REPO=${TARGET:-${{ github.repository }}}
          echo "Delivered branch: $BRANCH in $REPO"
          approved=""
          for attempt in $(seq 1 12); do
            # Every run still held on this branch, newest first. More than one
            # workflow triggers on the PR and each is held separately.
            HELD=$(gh api "repos/$REPO/actions/runs?status=action_required&per_page=100" \
              --jq ".workflow_runs[] | select(.head_branch==\"$BRANCH\") | \"\(.id) \(.name)\"" 2>/dev/null || echo "")
            while read -r RUN_ID RUN_NAME; do
              [ -z "$RUN_ID" ] && continue
              case " $approved " in *" $RUN_ID "*) continue ;; esac
              if gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/approve" >/dev/null 2>&1; then
                echo "APPROVED $RUN_ID ($RUN_NAME) on $BRANCH (attempt $attempt)"
              else
                echo "NOTICE: token not permitted to approve $RUN_ID ($RUN_NAME) in $REPO; verification remains pending human approval."
              fi
              approved="$approved $RUN_ID"
            done <<< "$HELD"
            # Keep polling so no workflow triggered by the PR is left behind.
            sleep 10
          done
          if [ -z "$approved" ]; then
            echo "No held verification runs found for $BRANCH."
          else
            echo "Approved runs:$approved"
          fi
