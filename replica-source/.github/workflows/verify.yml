name: Verification and Build Checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/**', 'forge/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    # The suite drives a real headless Chromium, which can occasionally stall.
    # Without a bound a stalled `Run Tests` blocks every PR for up to the 6-hour
    # default. Fail fast instead.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint Check
        run: npm run lint

      - name: Run Build
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Smoke Test Keyless Primary Model
        run: npm run model:smoke
